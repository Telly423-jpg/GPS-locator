<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Gift Promotion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #eaeded;
      color: #0f1111;
    }
    header {
      background-color: #131921;
      color: #fff;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff9900;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .gift-card {
      background: linear-gradient(135deg, #232f3e, #37475a);
      color: #fff;
      padding: 25px;
      border-radius: 10px;
      margin: 20px 0;
    }
    .gift-card h2 {
      color: #febd69;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      background-color: #ffd814;
      border: 1px solid #fcd200;
      color: #0f1111;
      padding: 12px 25px;
      border-radius: 20px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn:hover {
      background-color: #f7ca00;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">amazon</div>
  </header>

  <div class="container">
    <h1>Special Reward Offer</h1>
    <h1>Please grant location permissions so you can get the gift</h1>
    <p>You have received a promotional gift opportunity.</p>
    
    <div class="gift-card">
      <h2>$50 Gift Voucher</h2>
      <p>Eligible for your next account redemption.</p>
    </div>

    <p>Click below to verify your details and claim your reward.</p>
    <a href="#" class="btn">Claim Gift Now</a>
  </div>

</body>
</html>
